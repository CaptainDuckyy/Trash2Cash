<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Trash2Cash - Sign in</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="login-page">

        <input type="radio" name="mode" id="tab-signin" checked>
        <input type="radio" name="mode" id="tab-signup">

        <main class="login-box">
            <a class="login-logo" href="landing.html">Trash<span class="two">2</span><span class="cash">Cash</span></a>

            <div class="tabs">
                <label for="tab-signin">Sign in</label>
                <label for="tab-signup">Create account</label>
            </div>

            <!--SiGN IN-->
            <form class="signin-form" action="upload.html" method="post">
                <h1>Welcome back</h1>

             <div class="field">
        <label for="signin-email">Email address</label>
        <input type="email" id="signin-email" name="email" required>
      </div>
      <div class="field">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" name="password" required>
      </div>
      <button type="submit" class="button full">Sign in</button>
    </form>

    <!--CREATE ACCOUNT -->
    <form class="signup-form" action="upload.html" method="post">
      <h1>Create your account</h1>

      <!-- <p class="error-message">That email is already registered.</p> -->

      <div class="field">
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" name="name" required>
      </div>
      <div class="field">
        <label for="signup-email">Email address</label>
        <input type="email" id="signup-email" name="email" required>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" minlength="8" required>
        <p class="small-text">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input type="password" id="signup-confirm" name="confirm" minlength="8" required>
      </div>
      <button type="submit" class="button full">Create account</button>   
            </form>

            <p class="back-link"><a href="landing.html">Back to home</a></p>
        </main>
    
    </body>
</html>
